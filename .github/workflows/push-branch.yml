name: Export branch for push from local machine
on:
  push:
    branches: ['qwen-code-7721f0d5-f112-4383-83df-ab5e5b264672']
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 'qwen-code-7721f0d5-f112-4383-83df-ab5e5b264672'
      - name: Create git bundle (all commits of the branch)
        run: |
          git bundle create branch.bundle --all
          ls -la branch.bundle
      - uses: actions/upload-artifact@v4
        with:
          name: scowlby-ai-branch-bundle
          path: branch.bundle
